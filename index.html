<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do List</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #d1a0bd 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 40px 16px;
    }

    .container {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
      width: 100%;
      max-width: 520px;
      overflow: hidden;
    }

    .header {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #fff;
      padding: 28px 28px 20px;
    }

    .header h1 {
      font-size: 1.8rem;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .header .stats {
      font-size: 0.9rem;
      opacity: 0.85;
    }

    .input-area {
      padding: 20px 28px;
      border-bottom: 1px solid #f0f0f0;
      display: flex;
      gap: 10px;
    }

    .input-area input {
      flex: 1;
      padding: 12px 16px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-area input:focus {
      border-color: #0f121f;
    }

    .btn-add {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 12px 20px;
      font-size: 1.2rem;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }

    .btn-add:hover { opacity: 0.9; }
    .btn-add:active { transform: scale(0.96); }

    .filters {
      display: flex;
      gap: 6px;
      padding: 14px 28px;
      border-bottom: 1px solid #f0f0f0;
    }

    .filter-btn {
      padding: 6px 16px;
      border: 2px solid #e0e0e0;
      border-radius: 20px;
      background: transparent;
      font-size: 0.85rem;
      cursor: pointer;
      color: #666;
      transition: all 0.2s;
    }

    .filter-btn.active {
      background: linear-gradient(135deg, #667eea, #764ba2);
      border-color: transparent;
      color: #fff;
    }

    .task-list {
      padding: 12px 0;
      min-height: 80px;
    }

    .task-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 28px;
      transition: background 0.15s;
    }

    .task-item:hover { background: #fafafa; }

    .task-item input[type="checkbox"] {
      width: 20px;
      height: 20px;
      accent-color: #667eea;
      cursor: pointer;
      flex-shrink: 0;
    }

    .task-text {
      flex: 1;
      font-size: 0.95rem;
      color: #333;
      word-break: break-word;
      outline: none;
      background: transparent;
      border: none;
      font-family: inherit;
      cursor: text;
    }

    .task-text.done {
      text-decoration: line-through;
      color: #aaa;
    }

    .btn-delete {
      background: none;
      border: none;
      color: #ccc;
      font-size: 1.1rem;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 6px;
      transition: color 0.2s, background 0.2s;
      flex-shrink: 0;
    }

    .btn-delete:hover {
      color: #e53e3e;
      background: #fff0f0;
    }

    .empty-state {
      text-align: center;
      padding: 40px 28px;
      color: #bbb;
      font-size: 0.95rem;
    }

    .empty-state .icon { font-size: 2.5rem; margin-bottom: 10px; }

    .footer {
      padding: 14px 28px;
      border-top: 1px solid #f0f0f0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .footer span { font-size: 0.82rem; color: #999; }

    .btn-clear {
      background: none;
      border: none;
      color: #e53e3e;
      font-size: 0.82rem;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 6px;
      transition: background 0.2s;
    }

    .btn-clear:hover { background: #fff0f0; }

    @media (max-width: 480px) {
      .header h1 { font-size: 1.4rem; }
      .input-area, .task-item, .filters, .footer { padding-left: 16px; padding-right: 16px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>📝 To-Do List</h1>
      <div class="stats" id="stats">0 งานทั้งหมด</div>
    </div>

    <div class="input-area">
      <input type="text" id="taskInput" placeholder="เพิ่มงานใหม่..." maxlength="200">
      <button class="btn-add" onclick="addTask()" title="เพิ่ม">+</button>
    </div>

    <div class="filters">
      <button class="filter-btn active" onclick="setFilter('all', this)">ทั้งหมด</button>
      <button class="filter-btn" onclick="setFilter('active', this)">ยังไม่เสร็จ</button>
      <button class="filter-btn" onclick="setFilter('done', this)">เสร็จแล้ว</button>
    </div>

    <div class="task-list" id="taskList"></div>

    <div class="footer">
      <span id="footerCount"></span>
      <button class="btn-clear" onclick="clearDone()">ลบงานที่เสร็จแล้ว</button>
    </div>
  </div>

  <script>
    let tasks = JSON.parse(localStorage.getItem('tasks') || '[]');
    let filter = 'all';

    function save() {
      localStorage.setItem('tasks', JSON.stringify(tasks));
    }

    function addTask() {
      const input = document.getElementById('taskInput');
      const text = input.value.trim();
      if (!text) return;
      tasks.unshift({ id: Date.now(), text, done: false });
      input.value = '';
      save();
      render();
    }

    function toggleTask(id) {
      const t = tasks.find(t => t.id === id);
      if (t) t.done = !t.done;
      save();
      render();
    }

    function deleteTask(id) {
      tasks = tasks.filter(t => t.id !== id);
      save();
      render();
    }

    function editTask(id, newText) {
      const t = tasks.find(t => t.id === id);
      if (t) t.text = newText.trim() || t.text;
      save();
    }

    function setFilter(f, btn) {
      filter = f;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      render();
    }

    function clearDone() {
      tasks = tasks.filter(t => !t.done);
      save();
      render();
    }

    function render() {
      const list = document.getElementById('taskList');
      const total = tasks.length;
      const doneCount = tasks.filter(t => t.done).length;

      document.getElementById('stats').textContent =
        `${total} งานทั้งหมด · เสร็จแล้ว ${doneCount}/${total}`;
      document.getElementById('footerCount').textContent =
        `เหลือ ${total - doneCount} งาน`;

      const filtered = tasks.filter(t =>
        filter === 'all' ? true : filter === 'done' ? t.done : !t.done
      );

      if (filtered.length === 0) {
        const msg = filter === 'done' ? 'ยังไม่มีงานที่เสร็จ' : 'ไม่มีงาน — เพิ่มงานใหม่ได้เลย!';
        list.innerHTML = `<div class="empty-state"><div class="icon">✅</div>${msg}</div>`;
        return;
      }

      list.innerHTML = filtered.map(t => `
        <div class="task-item" id="item-${t.id}">
          <input type="checkbox" ${t.done ? 'checked' : ''} onchange="toggleTask(${t.id})">
          <span
            class="task-text${t.done ? ' done' : ''}"
            contenteditable="true"
            onblur="editTask(${t.id}, this.textContent)"
            onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur()}"
          >${escHtml(t.text)}</span>
          <button class="btn-delete" onclick="deleteTask(${t.id})" title="ลบ">✕</button>
        </div>
      `).join('');
    }

    function escHtml(str) {
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    document.getElementById('taskInput').addEventListener('keydown', e => {
      if (e.key === 'Enter') addTask();
    });

    render();
  </script>
</body>
</html>
