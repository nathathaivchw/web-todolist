<!DOCTYPE html>
<html lang="th" class="">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do List</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['"Segoe UI"', 'system-ui', 'sans-serif'] },
          animation: {
            'fade-in-up': 'fadeInUp 0.4s ease-out forwards',
            'slide-in':   'slideIn 0.32s cubic-bezier(0.22,1,0.36,1) forwards',
            'slide-out':  'slideOut 0.26s ease-in forwards',
            'gradient-shift': 'gradientShift 8s ease infinite',
            'pop': 'pop 0.3s cubic-bezier(0.34,1.56,0.64,1)',
            'ping-once': 'pingOnce 0.5s ease-out',
            'sub-open': 'subOpen 0.25s ease-out forwards',
          },
          keyframes: {
            fadeInUp:      { '0%': {opacity:'0',transform:'translateY(14px)'}, '100%': {opacity:'1',transform:'translateY(0)'} },
            slideIn:       { '0%': {opacity:'0',transform:'translateX(-14px)'}, '100%': {opacity:'1',transform:'translateX(0)'} },
            slideOut:      { '0%': {opacity:'1',transform:'translateX(0)',maxHeight:'120px'}, '100%': {opacity:'0',transform:'translateX(20px)',maxHeight:'0',paddingTop:'0',paddingBottom:'0',marginTop:'0'} },
            gradientShift: { '0%,100%':{backgroundPosition:'0% 50%'}, '50%':{backgroundPosition:'100% 50%'} },
            pop:           { '0%':{transform:'scale(1)'}, '50%':{transform:'scale(1.22)'}, '100%':{transform:'scale(1)'} },
            pingOnce:      { '0%':{boxShadow:'0 0 0 0 rgba(99,102,241,0.5)'}, '100%':{boxShadow:'0 0 0 14px rgba(99,102,241,0)'} },
            subOpen:       { '0%':{opacity:'0',transform:'scaleY(0.95)',transformOrigin:'top'}, '100%':{opacity:'1',transform:'scaleY(1)'} },
          },
        },
      },
    };
  </script>
  <style>
    /* scrollbar */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #c4b5fd; border-radius: 9999px; }
    .dark ::-webkit-scrollbar-thumb { background: #6d28d9; }

    /* drag ghost */
    .dragging { opacity: 0.4; }
    .drag-over { outline: 2px dashed #818cf8; outline-offset: 2px; border-radius: 12px; }

    /* progress bar */
    .progress-bar { transition: width 0.4s cubic-bezier(0.4,0,0.2,1); }

    /* pomodoro ring */
    .ring-bg  { stroke: #e0e7ff; }
    .ring-fg  { stroke: #6366f1; stroke-linecap: round; transition: stroke-dashoffset 1s linear; }
    .dark .ring-bg { stroke: #312e81; }
    .dark .ring-fg { stroke: #a5b4fc; }

    /* hide number input arrows */
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; }
  </style>
</head>
<body class="min-h-screen flex items-start justify-center px-3 py-8 font-sans bg-[length:200%_200%] bg-gradient-to-br from-violet-300 via-purple-400 to-indigo-600 animate-gradient-shift transition-colors duration-500 dark:from-gray-900 dark:via-gray-900 dark:to-gray-900">

<div class="w-full max-w-xl opacity-0 animate-fade-in-up">

  <!-- ===== CARD ===== -->
  <div class="rounded-2xl overflow-hidden shadow-2xl shadow-purple-900/30 bg-white dark:bg-gray-800 transition-colors duration-300">

    <!-- HEADER -->
    <header class="bg-gradient-to-r from-indigo-500 to-purple-600 dark:from-indigo-700 dark:to-purple-800 text-white px-6 py-5">
      <div class="flex items-start justify-between gap-3">
        <div class="flex-1 min-w-0">
          <h1 class="text-2xl sm:text-3xl font-bold tracking-tight mb-0.5">📝 To-Do List</h1>
          <p id="stats" class="text-sm text-white/80 transition-all duration-300">0 งานทั้งหมด</p>
        </div>
        <div class="flex items-center gap-2 shrink-0 mt-1">
          <!-- Dark mode toggle -->
          <button onclick="toggleDark()" title="Dark mode"
            class="w-9 h-9 rounded-full bg-white/20 hover:bg-white/30 flex items-center justify-center text-lg transition-all duration-200 active:scale-90">
            <span id="darkIcon">🌙</span>
          </button>
          <!-- Pomodoro open -->
          <button onclick="openPomodoro()" title="Pomodoro Timer"
            class="w-9 h-9 rounded-full bg-white/20 hover:bg-white/30 flex items-center justify-center text-lg transition-all duration-200 active:scale-90">🍅</button>
        </div>
      </div>
    </header>

    <!-- SEARCH -->
    <div class="px-6 pt-4 pb-2">
      <div class="relative">
        <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-sm">🔍</span>
        <input id="searchInput" type="text" placeholder="ค้นหางาน..."
          oninput="render()"
          class="w-full pl-9 pr-4 py-2.5 text-sm border-2 border-gray-200 dark:border-gray-600 rounded-xl outline-none bg-white dark:bg-gray-700 dark:text-white transition-all duration-200 focus:border-indigo-400 focus:ring-4 focus:ring-indigo-400/20">
      </div>
    </div>

    <!-- ADD TASK FORM -->
    <div class="px-6 py-3 border-b border-gray-100 dark:border-gray-700 space-y-2.5">
      <div class="flex gap-2">
        <input id="taskInput" type="text" placeholder="เพิ่มงานใหม่..." maxlength="200"
          onkeydown="if(event.key==='Enter')addTask()"
          class="flex-1 px-4 py-2.5 text-sm border-2 border-gray-200 dark:border-gray-600 rounded-xl outline-none bg-white dark:bg-gray-700 dark:text-white transition-all duration-200 focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/20 focus:scale-[1.01]">
        <button onclick="addTask()" title="เพิ่ม"
          class="px-5 text-xl font-medium text-white bg-gradient-to-r from-indigo-500 to-purple-600 rounded-xl shadow-md shadow-indigo-500/30 transition-all duration-200 hover:opacity-90 hover:-translate-y-0.5 hover:shadow-lg active:scale-95 active:translate-y-0">+</button>
      </div>

      <!-- Extra options row -->
      <div class="flex flex-wrap gap-2 items-center">
        <!-- Priority -->
        <select id="newPriority"
          class="text-xs px-2.5 py-1.5 border-2 border-gray-200 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 dark:text-white outline-none cursor-pointer transition-colors focus:border-indigo-400">
          <option value="medium">🟡 กลาง</option>
          <option value="high">🔴 สูง</option>
          <option value="low">🟢 ต่ำ</option>
        </select>
        <!-- Tag -->
        <select id="newTag"
          class="text-xs px-2.5 py-1.5 border-2 border-gray-200 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 dark:text-white outline-none cursor-pointer transition-colors focus:border-indigo-400">
          <option value="">🏷️ ไม่มี tag</option>
          <option value="work">💼 งาน</option>
          <option value="home">🏠 บ้าน</option>
          <option value="study">📚 เรียน</option>
          <option value="personal">🙋 ส่วนตัว</option>
        </select>
        <!-- Due date -->
        <input type="date" id="newDue"
          class="text-xs px-2.5 py-1.5 border-2 border-gray-200 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 dark:text-white outline-none cursor-pointer transition-colors focus:border-indigo-400">
      </div>
    </div>

    <!-- FILTERS -->
    <div class="flex flex-wrap gap-1.5 px-6 py-3 border-b border-gray-100 dark:border-gray-700">
      <!-- Status filters -->
      <button data-filter="all"    onclick="setFilter('all',this)"    class="filter-btn px-3 py-1 text-xs rounded-full border-2 transition-all duration-200 active:scale-95 border-transparent bg-gradient-to-r from-indigo-500 to-purple-600 text-white shadow-sm">ทั้งหมด</button>
      <button data-filter="active" onclick="setFilter('active',this)" class="filter-btn px-3 py-1 text-xs rounded-full border-2 transition-all duration-200 active:scale-95 border-gray-200 dark:border-gray-600 text-gray-600 dark:text-gray-300">ยังไม่เสร็จ</button>
      <button data-filter="done"   onclick="setFilter('done',this)"   class="filter-btn px-3 py-1 text-xs rounded-full border-2 transition-all duration-200 active:scale-95 border-gray-200 dark:border-gray-600 text-gray-600 dark:text-gray-300">เสร็จแล้ว</button>
      <div class="w-px bg-gray-200 dark:bg-gray-600 mx-0.5 self-stretch"></div>
      <!-- Tag filters -->
      <button data-tag="" onclick="setTag('',this)" class="tag-btn px-3 py-1 text-xs rounded-full border-2 transition-all duration-200 active:scale-95 border-transparent bg-indigo-100 dark:bg-indigo-900/50 text-indigo-700 dark:text-indigo-300">ทุก tag</button>
      <button data-tag="work"     onclick="setTag('work',this)"     class="tag-btn px-3 py-1 text-xs rounded-full border-2 transition-all duration-200 active:scale-95 border-gray-200 dark:border-gray-600 text-gray-600 dark:text-gray-300">💼</button>
      <button data-tag="home"     onclick="setTag('home',this)"     class="tag-btn px-3 py-1 text-xs rounded-full border-2 transition-all duration-200 active:scale-95 border-gray-200 dark:border-gray-600 text-gray-600 dark:text-gray-300">🏠</button>
      <button data-tag="study"    onclick="setTag('study',this)"    class="tag-btn px-3 py-1 text-xs rounded-full border-2 transition-all duration-200 active:scale-95 border-gray-200 dark:border-gray-600 text-gray-600 dark:text-gray-300">📚</button>
      <button data-tag="personal" onclick="setTag('personal',this)" class="tag-btn px-3 py-1 text-xs rounded-full border-2 transition-all duration-200 active:scale-95 border-gray-200 dark:border-gray-600 text-gray-600 dark:text-gray-300">🙋</button>
    </div>

    <!-- TASK LIST -->
    <div id="taskList" class="min-h-[80px] py-2 max-h-[420px] overflow-y-auto"></div>

    <!-- FOOTER -->
    <footer class="flex justify-between items-center px-6 py-3 border-t border-gray-100 dark:border-gray-700">
      <span id="footerCount" class="text-xs text-gray-400 dark:text-gray-500"></span>
      <button onclick="clearDone()"
        class="text-xs text-red-500 px-2 py-1 rounded-md transition-all duration-200 hover:bg-red-50 dark:hover:bg-red-900/30 active:scale-95">
        🗑 ลบงานที่เสร็จแล้ว
      </button>
    </footer>
  </div>

  <!-- ===== POMODORO MODAL ===== -->
  <div id="pomodoroModal" class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center z-50 px-4" onclick="if(event.target===this)closePomodoro()">
    <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-2xl w-full max-w-sm p-6 animate-pop text-center">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-lg font-bold text-gray-800 dark:text-white">🍅 Pomodoro Timer</h2>
        <button onclick="closePomodoro()" class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 text-xl transition-colors">✕</button>
      </div>

      <!-- Ring -->
      <div class="flex justify-center mb-4 relative">
        <svg width="160" height="160" class="-rotate-90">
          <circle class="ring-bg" cx="80" cy="80" r="68" fill="none" stroke-width="10"/>
          <circle id="ringFg" class="ring-fg" cx="80" cy="80" r="68" fill="none" stroke-width="10"
            stroke-dasharray="427" stroke-dashoffset="0"/>
        </svg>
        <div class="absolute inset-0 flex flex-col items-center justify-center">
          <span id="pomoClock" class="text-3xl font-bold text-gray-800 dark:text-white">25:00</span>
          <span id="pomoPhase" class="text-xs text-gray-400 dark:text-gray-400 mt-0.5">โฟกัส</span>
        </div>
      </div>

      <!-- Sessions -->
      <div class="flex justify-center gap-1.5 mb-4" id="sessions"></div>

      <!-- Controls -->
      <div class="flex justify-center gap-2.5 mb-4">
        <button onclick="pomoControl('start')" id="pomoStartBtn"
          class="px-5 py-2 bg-gradient-to-r from-indigo-500 to-purple-600 text-white text-sm font-medium rounded-xl shadow-md shadow-indigo-500/30 transition-all hover:opacity-90 active:scale-95">▶ เริ่ม</button>
        <button onclick="pomoControl('pause')" id="pomoPauseBtn" disabled
          class="px-5 py-2 bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 text-sm font-medium rounded-xl transition-all hover:bg-gray-200 dark:hover:bg-gray-600 active:scale-95 disabled:opacity-40">⏸ หยุด</button>
        <button onclick="pomoControl('reset')"
          class="px-5 py-2 bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 text-sm font-medium rounded-xl transition-all hover:bg-gray-200 dark:hover:bg-gray-600 active:scale-95">↺ รีเซ็ต</button>
      </div>

      <!-- Duration settings -->
      <div class="flex justify-center gap-4 text-xs text-gray-500 dark:text-gray-400">
        <label class="flex flex-col items-center gap-1">
          <span>โฟกัส (นาที)</span>
          <input type="number" id="focusMin" value="25" min="1" max="60" oninput="updatePomoSettings()"
            class="w-14 text-center px-2 py-1 border-2 border-gray-200 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 dark:text-white text-sm outline-none focus:border-indigo-400">
        </label>
        <label class="flex flex-col items-center gap-1">
          <span>พัก (นาที)</span>
          <input type="number" id="breakMin" value="5" min="1" max="30" oninput="updatePomoSettings()"
            class="w-14 text-center px-2 py-1 border-2 border-gray-200 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 dark:text-white text-sm outline-none focus:border-indigo-400">
        </label>
      </div>
    </div>
  </div>

</div><!-- /max-w-xl -->

<script>
/* ─── STATE ─────────────────────────────────── */
let tasks    = JSON.parse(localStorage.getItem('tasks') || '[]');
let filter   = 'all';
let activeTag = '';
let dragId   = null;
let dragOver = null;

const PRIORITY_LABEL = { high:'🔴', medium:'🟡', low:'🟢' };
const PRIORITY_SORT  = { high:0, medium:1, low:2 };
const TAG_LABEL      = { work:'💼 งาน', home:'🏠 บ้าน', study:'📚 เรียน', personal:'🙋 ส่วนตัว' };

/* ─── PERSIST ───────────────────────────────── */
function save() { localStorage.setItem('tasks', JSON.stringify(tasks)); }

/* ─── ADD TASK ──────────────────────────────── */
function addTask() {
  const input = document.getElementById('taskInput');
  const text  = input.value.trim();
  if (!text) { input.classList.add('!border-red-400'); setTimeout(()=>input.classList.remove('!border-red-400'),600); return; }
  tasks.unshift({
    id:       Date.now(),
    text,
    done:     false,
    priority: document.getElementById('newPriority').value,
    tag:      document.getElementById('newTag').value,
    due:      document.getElementById('newDue').value,
    subs:     [],
  });
  input.value = '';
  document.getElementById('newDue').value = '';
  save(); render(); input.focus();
}

/* ─── TOGGLE / DELETE ───────────────────────── */
function toggleTask(id) {
  const t = tasks.find(t=>t.id===id);
  if (t) { t.done = !t.done; save(); render(); }
}
function deleteTask(id) {
  const el = document.getElementById(`item-${id}`);
  if (el) {
    el.classList.add('animate-slide-out','overflow-hidden');
    el.addEventListener('animationend', ()=>{ tasks=tasks.filter(t=>t.id!==id); save(); render(); }, {once:true});
  } else { tasks=tasks.filter(t=>t.id!==id); save(); render(); }
}
function clearDone() { tasks=tasks.filter(t=>!t.done); save(); render(); }

/* ─── EDIT ──────────────────────────────────── */
function editText(id, el) {
  const t = tasks.find(t=>t.id===id);
  if (t && el.innerText.trim()) { t.text=el.innerText.trim(); save(); }
  else if (t) el.innerText = t.text;
}

/* ─── PRIORITY ──────────────────────────────── */
function cyclePriority(id) {
  const t = tasks.find(t=>t.id===id);
  if (!t) return;
  const order = ['high','medium','low'];
  t.priority = order[(order.indexOf(t.priority)+1) % order.length];
  save(); render();
}

/* ─── SUB-TASKS ─────────────────────────────── */
function addSub(id) {
  const input = document.getElementById(`subInput-${id}`);
  const text  = input?.value.trim();
  if (!text) return;
  const t = tasks.find(t=>t.id===id);
  if (t) { t.subs.push({ id: Date.now(), text, done: false }); save(); render(); }
}
function toggleSub(taskId, subId) {
  const t = tasks.find(t=>t.id===taskId);
  const s = t?.subs.find(s=>s.id===subId);
  if (s) { s.done=!s.done; save(); render(); }
}
function deleteSub(taskId, subId) {
  const t = tasks.find(t=>t.id===taskId);
  if (t) { t.subs=t.subs.filter(s=>s.id!==subId); save(); render(); }
}
function toggleSubPanel(id) {
  const panel = document.getElementById(`subPanel-${id}`);
  if (!panel) return;
  panel.classList.toggle('hidden');
}

/* ─── FILTERS ───────────────────────────────── */
function setFilter(f, btn) {
  filter = f;
  document.querySelectorAll('.filter-btn').forEach(b => {
    const on = b.dataset.filter === f;
    b.className = b.className
      .replace(/border-transparent bg-gradient-to-r from-indigo-500 to-purple-600 text-white shadow-sm/g,'')
      .replace(/border-gray-200 dark:border-gray-600 text-gray-600 dark:text-gray-300/g,'').trim();
    b.classList.add(...(on
      ? ['border-transparent','bg-gradient-to-r','from-indigo-500','to-purple-600','text-white','shadow-sm']
      : ['border-gray-200','dark:border-gray-600','text-gray-600','dark:text-gray-300']));
  });
  render();
}
function setTag(tag, btn) {
  activeTag = tag;
  document.querySelectorAll('.tag-btn').forEach(b => {
    const on = b.dataset.tag === tag;
    b.className = b.className
      .replace(/border-transparent bg-indigo-100 dark:bg-indigo-900\/50 text-indigo-700 dark:text-indigo-300/g,'')
      .replace(/border-gray-200 dark:border-gray-600 text-gray-600 dark:text-gray-300/g,'').trim();
    b.classList.add(...(on
      ? ['border-transparent','bg-indigo-100','dark:bg-indigo-900/50','text-indigo-700','dark:text-indigo-300']
      : ['border-gray-200','dark:border-gray-600','text-gray-600','dark:text-gray-300']));
  });
  render();
}

/* ─── DRAG & DROP ───────────────────────────── */
function onDragStart(e, id) { dragId=id; e.currentTarget.classList.add('dragging'); e.dataTransfer.effectAllowed='move'; }
function onDragEnd(e)       { e.currentTarget.classList.remove('dragging'); document.querySelectorAll('.drag-over').forEach(el=>el.classList.remove('drag-over')); }
function onDragOver(e, id)  { e.preventDefault(); e.dataTransfer.dropEffect='move'; dragOver=id; document.querySelectorAll('.drag-over').forEach(el=>el.classList.remove('drag-over')); if(dragId!==id) e.currentTarget.classList.add('drag-over'); }
function onDrop(e, id) {
  e.preventDefault();
  if (!dragId || dragId===id) return;
  const fromIdx = tasks.findIndex(t=>t.id===dragId);
  const toIdx   = tasks.findIndex(t=>t.id===id);
  const [moved] = tasks.splice(fromIdx, 1);
  tasks.splice(toIdx, 0, moved);
  dragId=null; save(); render();
}

/* ─── DUE DATE HELPERS ──────────────────────── */
function dueClass(due, done) {
  if (!due || done) return '';
  const today = new Date(); today.setHours(0,0,0,0);
  const d = new Date(due); d.setHours(0,0,0,0);
  const diff = (d - today) / 86400000;
  if (diff < 0)  return 'text-red-600 dark:text-red-400 font-semibold';
  if (diff <= 1) return 'text-orange-500 dark:text-orange-400 font-semibold';
  if (diff <= 3) return 'text-yellow-600 dark:text-yellow-400';
  return 'text-gray-400 dark:text-gray-500';
}
function dueLabel(due) {
  if (!due) return '';
  const today = new Date(); today.setHours(0,0,0,0);
  const d = new Date(due); d.setHours(0,0,0,0);
  const diff = (d - today) / 86400000;
  if (diff < 0)  return `📅 เกิน ${Math.abs(diff)|0} วัน`;
  if (diff === 0) return '📅 วันนี้';
  if (diff === 1) return '📅 พรุ่งนี้';
  return `📅 ${due}`;
}

/* ─── RENDER ────────────────────────────────── */
function render() {
  const list      = document.getElementById('taskList');
  const q         = (document.getElementById('searchInput')?.value || '').toLowerCase();
  const total     = tasks.length;
  const doneCount = tasks.filter(t=>t.done).length;

  document.getElementById('stats').textContent =
    `${total} งานทั้งหมด · เสร็จแล้ว ${doneCount}/${total}`;
  document.getElementById('footerCount').textContent =
    `เหลืออีก ${total - doneCount} งาน`;

  let filtered = tasks
    .filter(t => filter==='all' ? true : filter==='done' ? t.done : !t.done)
    .filter(t => !activeTag || t.tag===activeTag)
    .filter(t => !q || t.text.toLowerCase().includes(q) || t.subs.some(s=>s.text.toLowerCase().includes(q)));

  if (filtered.length === 0) {
    list.innerHTML = `<div class="text-center py-10 text-gray-300 dark:text-gray-600">
      <div class="text-4xl mb-2">✅</div>
      <div class="text-sm">${q ? 'ไม่พบงานที่ค้นหา' : 'ไม่มีงาน — เพิ่มได้เลย!'}</div>
    </div>`;
    return;
  }

  list.innerHTML = filtered.map(t => {
    const subsDone  = t.subs.filter(s=>s.done).length;
    const subsTotal = t.subs.length;
    const progress  = subsTotal ? Math.round((subsDone/subsTotal)*100) : 0;
    const dueCls    = dueClass(t.due, t.done);
    const dueText   = dueLabel(t.due);
    const tagText   = t.tag ? TAG_LABEL[t.tag] : '';

    return `
    <div id="item-${t.id}"
      class="group px-5 py-3 transition-all duration-200 hover:bg-indigo-50/60 dark:hover:bg-indigo-900/20 cursor-grab active:cursor-grabbing border-b border-gray-50 dark:border-gray-700/50 last:border-0"
      draggable="true"
      ondragstart="onDragStart(event,${t.id})"
      ondragend="onDragEnd(event)"
      ondragover="onDragOver(event,${t.id})"
      ondrop="onDrop(event,${t.id})">

      <div class="flex items-start gap-3">
        <!-- Checkbox -->
        <button onclick="toggleTask(${t.id})"
          class="mt-0.5 w-5 h-5 shrink-0 rounded-full border-2 flex items-center justify-center transition-all duration-200 ${t.done ? 'bg-indigo-500 border-indigo-500' : 'border-gray-300 dark:border-gray-500 hover:border-indigo-400'}">
          ${t.done ? '<span class="text-white text-xs leading-none">✓</span>' : ''}
        </button>

        <!-- Content -->
        <div class="flex-1 min-w-0">
          <div class="flex items-start gap-2 flex-wrap">
            <!-- Priority badge -->
            <button onclick="cyclePriority(${t.id})" title="เปลี่ยน priority"
              class="text-sm shrink-0 hover:scale-125 active:scale-95 transition-transform duration-150 mt-0.5">
              ${PRIORITY_LABEL[t.priority || 'medium']}
            </button>
            <!-- Text -->
            <span contenteditable="true"
              onblur="editText(${t.id},this)"
              onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur()}"
              class="text-sm flex-1 min-w-0 outline-none break-words rounded px-0.5 -mx-0.5 transition-colors focus:bg-indigo-50 dark:focus:bg-indigo-900/30 ${t.done ? 'line-through text-gray-400 dark:text-gray-500' : 'text-gray-800 dark:text-gray-100'}"
            >${escHtml(t.text)}</span>
          </div>

          <!-- Meta row -->
          <div class="flex flex-wrap items-center gap-2 mt-1">
            ${tagText ? `<span class="text-xs text-indigo-500 dark:text-indigo-400 bg-indigo-50 dark:bg-indigo-900/40 px-2 py-0.5 rounded-full">${tagText}</span>` : ''}
            ${dueText ? `<span class="text-xs ${dueCls}">${dueText}</span>` : ''}
            ${subsTotal ? `<span class="text-xs text-gray-400 dark:text-gray-500">${subsDone}/${subsTotal} sub-tasks</span>` : ''}
          </div>

          <!-- Progress bar -->
          ${subsTotal ? `
          <div class="mt-1.5 h-1.5 w-full bg-gray-100 dark:bg-gray-700 rounded-full overflow-hidden">
            <div class="progress-bar h-full rounded-full ${progress===100 ? 'bg-green-400' : 'bg-indigo-400'}" style="width:${progress}%"></div>
          </div>` : ''}
        </div>

        <!-- Action buttons -->
        <div class="flex items-center gap-1 opacity-0 group-hover:opacity-100 transition-opacity duration-150 shrink-0">
          <button onclick="toggleSubPanel(${t.id})" title="Sub-tasks"
            class="text-sm w-7 h-7 rounded-lg flex items-center justify-center text-gray-400 hover:text-indigo-500 hover:bg-indigo-50 dark:hover:bg-indigo-900/40 transition-all active:scale-90">📋</button>
          <button onclick="deleteTask(${t.id})" title="ลบ"
            class="text-sm w-7 h-7 rounded-lg flex items-center justify-center text-gray-400 hover:text-red-500 hover:bg-red-50 dark:hover:bg-red-900/30 transition-all active:scale-90">✕</button>
        </div>
      </div>

      <!-- Sub-task panel -->
      <div id="subPanel-${t.id}" class="hidden mt-2 ml-8 animate-sub-open">
        <div class="space-y-1 mb-2">
          ${t.subs.map(s=>`
          <div class="flex items-center gap-2 group/sub">
            <button onclick="toggleSub(${t.id},${s.id})"
              class="w-4 h-4 shrink-0 rounded border-2 flex items-center justify-center transition-all ${s.done ? 'bg-indigo-400 border-indigo-400' : 'border-gray-300 dark:border-gray-500 hover:border-indigo-400'}">
              ${s.done ? '<span class="text-white text-[9px] leading-none">✓</span>' : ''}
            </button>
            <span class="text-xs flex-1 ${s.done ? 'line-through text-gray-400' : 'text-gray-700 dark:text-gray-300'}">${escHtml(s.text)}</span>
            <button onclick="deleteSub(${t.id},${s.id})" class="text-gray-300 hover:text-red-400 text-xs opacity-0 group-hover/sub:opacity-100 transition-all">✕</button>
          </div>`).join('')}
        </div>
        <div class="flex gap-1.5">
          <input id="subInput-${t.id}" type="text" placeholder="เพิ่ม sub-task..."
            onkeydown="if(event.key==='Enter')addSub(${t.id})"
            class="flex-1 text-xs px-3 py-1.5 border-2 border-gray-200 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 dark:text-white outline-none focus:border-indigo-400 transition-colors">
          <button onclick="addSub(${t.id})"
            class="text-xs px-3 py-1.5 bg-indigo-500 text-white rounded-lg hover:bg-indigo-600 active:scale-95 transition-all">+</button>
        </div>
      </div>

    </div>`;
  }).join('');
}

/* ─── DARK MODE ─────────────────────────────── */
function toggleDark() {
  const isDark = document.documentElement.classList.toggle('dark');
  document.getElementById('darkIcon').textContent = isDark ? '☀️' : '🌙';
  localStorage.setItem('darkMode', isDark ? '1' : '0');
}
if (localStorage.getItem('darkMode') === '1') {
  document.documentElement.classList.add('dark');
  document.getElementById('darkIcon').textContent = '☀️';
}

/* ─── POMODORO ──────────────────────────────── */
let pomoTimer = null, pomoRunning = false;
let pomoFocusSec = 25*60, pomoBreakSec = 5*60;
let pomoCurrent = pomoFocusSec, pomoPhase = 'focus', pomoSession = 0;
const CIRC = 2 * Math.PI * 68; // 427

function renderPomo() {
  const total  = pomoPhase==='focus' ? pomoFocusSec : pomoBreakSec;
  const pct    = pomoCurrent / total;
  const offset = CIRC * (1 - pct);
  const m = String(Math.floor(pomoCurrent/60)).padStart(2,'0');
  const s = String(pomoCurrent%60).padStart(2,'0');
  document.getElementById('pomoClock').textContent = `${m}:${s}`;
  document.getElementById('pomoPhase').textContent  = pomoPhase==='focus' ? '🎯 โฟกัส' : '☕ พัก';
  document.getElementById('ringFg').setAttribute('stroke-dashoffset', offset);

  const sessions = document.getElementById('sessions');
  sessions.innerHTML = Array.from({length:4},(_,i)=>
    `<div class="w-4 h-4 rounded-full transition-all duration-300 ${i < pomoSession ? 'bg-indigo-500' : 'bg-gray-200 dark:bg-gray-600'}"></div>`
  ).join('');
}

function pomoControl(action) {
  if (action === 'start') {
    if (pomoRunning) return;
    pomoRunning = true;
    document.getElementById('pomoStartBtn').disabled = true;
    document.getElementById('pomoPauseBtn').disabled = false;
    pomoTimer = setInterval(() => {
      pomoCurrent--;
      if (pomoCurrent <= 0) {
        clearInterval(pomoTimer); pomoRunning = false;
        if (pomoPhase === 'focus') {
          pomoSession = Math.min(pomoSession+1, 4);
          pomoPhase = 'break'; pomoCurrent = pomoBreakSec;
        } else {
          pomoPhase = 'focus'; pomoCurrent = pomoFocusSec;
          if (pomoSession >= 4) pomoSession = 0;
        }
        document.getElementById('pomoStartBtn').disabled = false;
        document.getElementById('pomoPauseBtn').disabled = true;
        try { new Audio('data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAA==').play(); } catch(_){}
      }
      renderPomo();
    }, 1000);
  } else if (action === 'pause') {
    clearInterval(pomoTimer); pomoRunning = false;
    document.getElementById('pomoStartBtn').disabled = false;
    document.getElementById('pomoPauseBtn').disabled = true;
  } else if (action === 'reset') {
    clearInterval(pomoTimer); pomoRunning = false;
    pomoCurrent = pomoPhase==='focus' ? pomoFocusSec : pomoBreakSec;
    document.getElementById('pomoStartBtn').disabled = false;
    document.getElementById('pomoPauseBtn').disabled = true;
    renderPomo();
  }
}

function updatePomoSettings() {
  const f = parseInt(document.getElementById('focusMin').value) || 25;
  const b = parseInt(document.getElementById('breakMin').value) || 5;
  pomoFocusSec = f*60; pomoBreakSec = b*60;
  clearInterval(pomoTimer); pomoRunning = false;
  pomoCurrent = pomoPhase==='focus' ? pomoFocusSec : pomoBreakSec;
  document.getElementById('pomoStartBtn').disabled = false;
  document.getElementById('pomoPauseBtn').disabled = true;
  renderPomo();
}

function openPomodoro()  { document.getElementById('pomodoroModal').classList.remove('hidden'); renderPomo(); }
function closePomodoro() { document.getElementById('pomodoroModal').classList.add('hidden'); }

/* ─── UTIL ──────────────────────────────────── */
function escHtml(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ─── INIT ──────────────────────────────────── */
render();
</script>
</body>
</html>
